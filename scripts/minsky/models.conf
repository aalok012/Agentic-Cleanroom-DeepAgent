# ─────────────────────────────────────────────────────────────────────────────
# models.conf — the two models under test, with the vLLM flags each needs.
# Sourced by serve_vllm.sbatch; select with MODEL_KEY.
#
# MINSKY CONSTRAINT: 1 GPU per user, 48 GB (RTX 6000 Ada or L40S), 8 h max.
# A 32B model at bf16 is ~64 GB of weights — it does NOT fit, and tensor
# parallelism is not an option because you cannot hold two GPUs. So both
# models MUST be quantized. Fits in 48 GB:
#
#   4-bit AWQ  ~19 GB weights  → ~27 GB left for KV cache   (preferred)
#   FP8        ~32 GB weights  → ~13 GB left for KV cache   (fallback)
#
# FP8 is native on both card types (Ada, compute 8.9) and vLLM quantizes the
# bf16 checkpoint at load — no pre-quantized repo needed, but it downloads the
# full ~64 GB checkpoint first and costs several minutes each start.
# ─────────────────────────────────────────────────────────────────────────────

model_config() {
  case "${1}" in

    qwen-coder)
      # Official AWQ build exists → use it. Smallest footprint, fastest start.
      MODEL_BF16="Qwen/Qwen2.5-Coder-32B-Instruct"
      MODEL_AWQ="Qwen/Qwen2.5-Coder-32B-Instruct-AWQ"
      DEFAULT_VARIANT="awq"
      EXTRA_ARGS=(--enable-auto-tool-choice --tool-call-parser hermes)
      NOTE="native tool calling; pipeline temperature 0.0 is fine"
      ;;

    qwen3)
      # Qwen3-32B: a HYBRID reasoning model — the chat template turns thinking ON by
      # default, so it emits <think>…</think> before the answer.
      #   --reasoning-parser qwen3 routes that into `reasoning_content`, leaving the
      #   `content` the pipeline parses as clean JSON (same problem the R1 distill has).
      # Unlike the R1 distill it DOES support tool calling, so structured output still
      # goes through the native hermes path rather than the text-recovery fallback.
      # Official 4-bit AWQ build exists → same footprint story as qwen-coder.
      # Qwen advise temperature 0.6 in thinking mode; at 0 it degenerates into loops.
      MODEL_BF16="Qwen/Qwen3-32B"
      MODEL_AWQ="Qwen/Qwen3-32B-AWQ"
      DEFAULT_VARIANT="awq"
      EXTRA_ARGS=(--enable-auto-tool-choice --tool-call-parser hermes --reasoning-parser qwen3)
      NOTE="thinking model WITH tool calling; needs CLEANROOM_LLM_TEMPERATURE=0.6"
      ;;

    r1-distill)
      # Reasoning model: emits <think>…</think> before answering.
      #   --reasoning-parser deepseek_r1 routes that to `reasoning_content` so the
      #   `content` the pipeline parses is clean JSON.
      # No official 4-bit build, so FP8-at-load is the default. Community AWQ
      # quants exist — if you vet one, set MODEL_AWQ and use MODEL_VARIANT=awq.
      # DeepSeek advise temperature ~0.6 and no system prompt; at 0 it loops.
      MODEL_BF16="deepseek-ai/DeepSeek-R1-Distill-Qwen-32B"
      MODEL_AWQ=""
      DEFAULT_VARIANT="fp8"
      EXTRA_ARGS=(--reasoning-parser deepseek_r1)
      NOTE="no tool calling; needs CLEANROOM_LLM_TEMPERATURE=0.6"
      ;;

    *)
      echo "unknown MODEL_KEY '${1}' — expected: qwen-coder | qwen3 | r1-distill" >&2
      return 1 ;;
  esac

  # Only one GPU is ever available on Minsky.
  VLLM_TP=1

  case "${MODEL_VARIANT:-$DEFAULT_VARIANT}" in
    awq)
      # awq_marlin, NOT awq. Passing `--quantization awq` explicitly overrides vLLM's own
      # kernel selection and forces the slow reference AWQ path — it logs "Detected that the
      # model can run with awq_marlin, however you specified quantization=awq explicitly, so
      # forcing awq" and then decodes at a few tokens/s on an Ada card. Marlin is the fast
      # kernel for 4-bit on compute 8.9 and is what vLLM picks on its own.
      [ -n "$MODEL_AWQ" ] || { echo "no vetted AWQ build for '${1}' — use MODEL_VARIANT=fp8" >&2; return 1; }
      VLLM_MODEL="$MODEL_AWQ"; EXTRA_ARGS+=(--quantization awq_marlin) ;;
    fp8)
      VLLM_MODEL="$MODEL_BF16"; EXTRA_ARGS+=(--quantization fp8) ;;
    bf16)
      echo "ERROR: bf16 32B needs ~64 GB; Minsky gives you one 48 GB GPU. Use awq or fp8." >&2
      return 1 ;;
    *)
      echo "unknown MODEL_VARIANT '${MODEL_VARIANT}' — expected awq | fp8" >&2; return 1 ;;
  esac
}
