# ─────────────────────────────────────────────────────────────────────────────
# models.conf — the two models under test, with the vLLM flags each needs.
# Sourced by serve_vllm.sbatch; select with MODEL_KEY.
#
# MINSKY CONSTRAINT: 1 GPU per user, 48 GB (RTX 6000 Ada or L40S), 8 h max.
# A 32B model at bf16 is ~64 GB of weights — it does NOT fit, and tensor
# parallelism is not an option because you cannot hold two GPUs. So both
# models MUST be quantized. Fits in 48 GB:
#
#   4-bit AWQ  ~19 GB weights  → ~27 GB left for KV cache   (preferred)
#   FP8        ~32 GB weights  → ~13 GB left for KV cache   (fallback)
#
# FP8 is native on both card types (Ada, compute 8.9) and vLLM quantizes the
# bf16 checkpoint at load — no pre-quantized repo needed, but it downloads the
# full ~64 GB checkpoint first and costs several minutes each start.
# ─────────────────────────────────────────────────────────────────────────────

model_config() {
  case "${1}" in

    qwen-coder)
      # Official AWQ build exists → use it. Smallest footprint, fastest start.
      MODEL_BF16="Qwen/Qwen2.5-Coder-32B-Instruct"
      MODEL_AWQ="Qwen/Qwen2.5-Coder-32B-Instruct-AWQ"
      DEFAULT_VARIANT="awq"
      EXTRA_ARGS=(--enable-auto-tool-choice --tool-call-parser hermes)
      NOTE="native tool calling; pipeline temperature 0.0 is fine"
      ;;

    qwen3.8)
      # Qwen3.8-27B. 27B at bf16 is ~54 GB — over Minsky's 48 GB card — and Qwen publish no
      # AWQ build, so use their OFFICIAL FP8 repo: ~27 GB of weights, already quantized, so
      # vLLM loads it directly instead of downloading 54 GB and quantizing at load.
      #
      # Hybrid reasoning like Qwen3, so the same --reasoning-parser applies to keep <think>
      # out of the `content` the pipeline parses. Qwen advise temperature 1.0 in thinking mode
      # and 0.7 in instruct mode, but this pipeline's generation agents ask for 0.0 on purpose
      # and that is what they get — see the temperature note in tunnel.sh.
      #
      # UNVERIFIED until a job actually loads it: config.json reports model_type `qwen3_5`
      # (architecture Qwen3_5ForConditionalGeneration), which the stock vllm-openai image must
      # be new enough to know. If it aborts with an unknown architecture, that is why —
      # point VLLM_SIF at a newer image.
      MODEL_BF16="Qwen/Qwen3.8-27B"
      MODEL_FP8_REPO="Qwen/Qwen3.8-27B-FP8"     # official pre-quantized build
      MODEL_AWQ=""
      DEFAULT_VARIANT="fp8-repo"
      # --enforce-eager: skip CUDA graph capture entirely. Lowering --gpu-memory-utilization
      # from 0.90 to 0.84 did NOT help (job 650 OOMed with byte-identical numbers) because the
      # failing allocation is inside profile_cudagraph_memory and counts non-PyTorch memory the
      # utilization cap does not govern. Eager mode costs some decode throughput but is the
      # difference between serving and not serving on a 48 GB card at 27 GB of weights.
      # --tool-call-parser qwen3_coder, NOT hermes. Measured against this build: the model
      # emits Qwen's XML tool-call format
      #     <tool_call><function=submit><parameter=value>42</parameter></function></tool_call>
      # whereas hermes expects JSON inside the <tool_call> tags. hermes silently fails to match
      # and returns the whole call as plain CONTENT with tool_calls empty — which looks exactly
      # like a model that cannot call tools, and would strand every submit_* in this pipeline.
      EXTRA_ARGS=(--enable-auto-tool-choice --tool-call-parser qwen3_coder --reasoning-parser qwen3
                  --enforce-eager)
      # 27 GB of FP8 weights leaves ~20 GB on a 48 GB card, and vLLM 0.19 sizes the KV cache
      # to --gpu-memory-utilization BEFORE profiling CUDA-graph memory. At the 0.90 default
      # that profiling OOMs by ~1.5 GB (measured, job 649). Leave it headroom.
      GPU_MEM_UTIL="${GPU_MEM_UTIL:-0.84}"
      NOTE="27B hybrid reasoning; official FP8 build; XML tool calls (qwen3_coder parser)"
      ;;

    r1-distill)
      # Reasoning model: emits <think>…</think> before answering.
      #   --reasoning-parser deepseek_r1 routes that to `reasoning_content` so the
      #   `content` the pipeline parses is clean JSON.
      # No official 4-bit build, so FP8-at-load is the default. Community AWQ
      # quants exist — if you vet one, set MODEL_AWQ and use MODEL_VARIANT=awq.
      # DeepSeek advise temperature ~0.6 and no system prompt; at 0 it loops.
      MODEL_BF16="deepseek-ai/DeepSeek-R1-Distill-Qwen-32B"
      MODEL_AWQ=""
      DEFAULT_VARIANT="fp8"
      EXTRA_ARGS=(--reasoning-parser deepseek_r1)
      NOTE="no tool calling; needs CLEANROOM_LLM_TEMPERATURE=0.6"
      ;;

    *)
      echo "unknown MODEL_KEY '${1}' — expected: qwen-coder | qwen3.8 | r1-distill" >&2
      return 1 ;;
  esac

  # Only one GPU is ever available on Minsky.
  VLLM_TP=1

  case "${MODEL_VARIANT:-$DEFAULT_VARIANT}" in
    awq)
      # awq_marlin, NOT awq. Passing `--quantization awq` explicitly overrides vLLM's own
      # kernel selection and forces the slow reference AWQ path — it logs "Detected that the
      # model can run with awq_marlin, however you specified quantization=awq explicitly, so
      # forcing awq" and then decodes at a few tokens/s on an Ada card. Marlin is the fast
      # kernel for 4-bit on compute 8.9 and is what vLLM picks on its own.
      [ -n "$MODEL_AWQ" ] || { echo "no vetted AWQ build for '${1}' — use MODEL_VARIANT=fp8" >&2; return 1; }
      VLLM_MODEL="$MODEL_AWQ"; EXTRA_ARGS+=(--quantization awq_marlin) ;;
    fp8-repo)
      # An already-quantized checkpoint: vLLM reads the method from the repo's config, so
      # passing --quantization here would override that and is wrong.
      [ -n "${MODEL_FP8_REPO:-}" ] || { echo "no official FP8 repo for '${1}' — use MODEL_VARIANT=fp8" >&2; return 1; }
      VLLM_MODEL="$MODEL_FP8_REPO" ;;
    fp8)
      VLLM_MODEL="$MODEL_BF16"; EXTRA_ARGS+=(--quantization fp8) ;;
    bf16)
      echo "ERROR: bf16 32B needs ~64 GB; Minsky gives you one 48 GB GPU. Use awq or fp8." >&2
      return 1 ;;
    *)
      echo "unknown MODEL_VARIANT '${MODEL_VARIANT}' — expected awq | fp8-repo | fp8" >&2; return 1 ;;
  esac
}
